<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Polaris · 健康全景</title>
  <style>
    :root{--sage:#99b396;--ink:#24362a;--muted:#6b8170;--paper:#f6f5ef;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{max-width:1320px;margin:0 auto;padding:40px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:24px}
    .eyebrow{color:#78927b;letter-spacing:.24em;font-size:12px;font-weight:700}.title{font-size:clamp(30px,4vw,54px);margin:12px 0 14px;letter-spacing:-.04em;line-height:1.1}
    .sub{font-size:13px;color:var(--muted)}a{color:var(--ink);text-decoration:none}.back{border:1px solid #d3ded1;border-radius:999px;padding:12px 19px;background:#fff}
    .auth{display:flex;gap:12px;margin:28px 0 20px;align-items:center}.auth input{min-width:320px;max-width:490px;flex:1;border:1px solid #d3ded1;background:#fff;padding:13px 16px;border-radius:13px;font:inherit;color:var(--ink)}
    button{background:var(--sage);border:0;border-radius:13px;padding:13px 18px;font:inherit;color:#23412a;cursor:pointer;font-weight:650}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0}
    .card{border-radius:24px;background:var(--white);border:1px solid #e4e9df;padding:25px;min-height:170px}.card-label{font-size:13px;color:var(--muted);margin-bottom:22px}
    .metric{font-size:clamp(30px,3.2vw,50px);font-weight:650;line-height:1.1;letter-spacing:-.05em}
    .unit{font-size:13px;color:var(--muted);margin-left:7px}.panel{border-radius:26px;background:#fff;border:1px solid #e4e9df;padding:25px;margin-top:16px}
    .headrow{display:flex;justify-content:space-between;align-items:center;gap:20px}.headrow h2{font-size:17px;margin:0}.small{font-size:12px;color:var(--muted)}
    #trend{margin-top:16px;display:flex;align-items:flex-end;gap:8px;height:188px;border-bottom:1px solid #dfebde}
    .barbox{flex:1;min-width:4px;max-width:38px;height:100%;display:flex;align-items:flex-end}
    .bar{width:100%;background:#a5bda5;border-radius:9px 9px 2px 2px;min-height:2px;transition:height .4s}.bar.empty{background:#e8ede6;min-height:0}
    table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px 8px;border-bottom:1px solid #ecf0e9;text-align:left}th{color:var(--muted);font-weight:500}
    #state{min-height:22px;color:var(--muted);font-size:13px}.empty{color:var(--muted)}@media(max-width:850px){main{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.auth{flex-wrap:wrap}.auth input{min-width:100%;width:100%}header{align-items:flex-start}.card{padding:18px;min-height:145px}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">POLARIS / VITALITY</div><h1 class="title">身体的时间线。</h1>
  <p class="sub">小米手环 11 NFC · 真实采集 · 每日汇总 · 与日程并行</p></div>
  <a class="back" href="./index.html">← 返回日程总览</a></header>
  <div class="auth"><input id="token" type="password" placeholder="输入本机健康同步令牌（当前会话有效）" autocomplete="off">
    <button id="refresh">读取健康记录</button><span id="state" role="status" aria-live="polite">尚未读取数据</span></div>
  <section class="grid">
    <div class="card"><div class="card-label">昨日 · 步数</div><span class="metric" id="steps">—</span><span class="unit">步</span></div>
    <div class="card"><div class="card-label">昨日 · 心率均值</div><span class="metric" id="hr">—</span><span class="unit">bpm</span></div>
    <div class="card"><div class="card-label">最近一次记录 · 睡眠</div><span class="metric" id="sleep">—</span><span class="unit">h</span></div>
    <div class="card"><div class="card-label">有数据的日期</div><span class="metric" id="days">—</span><span class="unit">天</span></div>
  </section>
  <section class="panel"><div class="headrow"><h2>步数曲线</h2><span class="small">最近 30 个自然日 · 未采集的日期不补零</span></div><div id="trend"></div></section>
  <section class="panel"><div class="headrow"><h2>最新健康记录</h2><span class="small">只显示实际入库的数据</span></div>
    <div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>日期</th><th>步数</th><th>心率</th><th>睡眠</th><th>数据源</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">暂无数据，先在手机端授权 Health Connect 并同步。</td></tr></tbody></table></div>
  </section>
</main>
<script>
(function(){
  var $=id=>document.getElementById(id), state=$('state'), token=$('token');
  function text(id,val){$(id).textContent=val;}
  function fmt(v){return typeof v==='number'?v.toLocaleString('zh-CN'):'—';}
  async function refresh(){
    var secret=token.value;
    if(!secret){state.textContent='请输入健康同步令牌';return;}
    state.textContent='正在读取…';
    try{
      var response=await fetch('/api/health/daily?days=365',{headers:{Authorization:'Bearer '+secret},cache:'no-store'});
      if(!response.ok)throw Error(response.status===401?'令牌不正确':'服务 HTTP '+response.status);
      var data=await response.json(), list=(data.rows||[]).sort((a,b)=>a.date.localeCompare(b.date));
      var latest=list[list.length-1]||{}, recent=list.slice(-30);
      text('steps',fmt(latest.steps));text('hr',fmt(latest.avg_hr));
      text('sleep',typeof latest.sleep_minutes==='number'?(latest.sleep_minutes/60).toFixed(1):'—');
      text('days',list.length.toString());
      $('rows').replaceChildren();
      if(!list.length){var tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='目前没有真实健康记录';tr.appendChild(td);$('rows').appendChild(tr);}
      list.slice(-14).reverse().forEach(function(row){
        var tr=document.createElement('tr');
        [row.date,fmt(row.steps),fmt(row.avg_hr),typeof row.sleep_minutes==='number'?(row.sleep_minutes/60).toFixed(1)+' h':'—',row.source||'—'].forEach(function(s){
          var td=document.createElement('td');td.textContent=s;tr.appendChild(td);
        });$('rows').appendChild(tr);
      });
      var byDate=new Map(recent.map(r=>[r.date,r])),max=Math.max(1,...recent.map(r=>r.steps||0));
      var end=new Date();end.setHours(12,0,0,0);var trend=$('trend');trend.replaceChildren();
      for(var i=29;i>=0;i--){
        var d=new Date(end);d.setDate(end.getDate()-i);
        var key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        var r=byDate.get(key),box=document.createElement('div'),bar=document.createElement('div');
        box.className='barbox';bar.className='bar'+(r&&typeof r.steps==='number'?'':' empty');
        bar.style.height=r&&typeof r.steps==='number'?Math.max(2,r.steps/max*96)+'%':'2px';
        bar.title=key+' · '+(r&&typeof r.steps==='number'?r.steps+' 步':'未采集');
        box.appendChild(bar);trend.appendChild(box);
      }
      state.textContent=list.length?'已读取 '+list.length+' 天记录':'没有健康记录';
    }catch(err){state.textContent='读取失败：'+err.message;}
  }
  $('refresh').addEventListener('click',refresh);
})();
</script></body></html>
