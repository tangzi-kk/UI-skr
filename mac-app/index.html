    <script>document.title = "";</script>
    <meta name="creative-medium" content="interactive-prototype" />
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var data = { type: 'ERROR', msg: String(msg), url: url, line: line, col: col, stack: error ? error.stack : '' };
        fetch('/api/log', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) }).catch(function(){});
      };
      console.error = (function(orig) {
        return function() {
          orig.apply(console, arguments);
          var args = Array.prototype.slice.call(arguments).map(function(a) {
            try {
              if (a instanceof Error) return a.message + " " + a.stack;
              return typeof a === 'object' ? JSON.stringify(a) : String(a);
            } catch(e) { return String(a); }
          });
          fetch('/api/log', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ type: 'CONSOLE_ERROR', args: args }) }).catch(function(){});
        };
      })(console.error);
    </script>
