function drawMoods(){let b=$('#faceOptions');b.innerHTML='';for(let i=0;i<6;i++){const e=document.createElement('button');e.className=`face-choice pos${i+1}`;e.dataset.id=i;e.setAttribute('aria-label',['兴奋','开心','平和','发呆','疲惫','释然'][i]);e.innerHTML=faceSVG(i,43);e.addEventListener('click',()=>chooseMood(i,true));b.append(e)}let saved=data.moods[TODAY];chooseMood(typeof saved==='number'?saved:3,false)}

function calendarDate(){let d=new Date(),y=d.getFullYear();return {d,year:y,day:Math.floor((Date.UTC(y,d.getMonth(),d.getDate())-Date.UTC(y,0,1))/86400000)+1,days:new Date(y,1,29).getMonth()===1?366:365}}

 // The entire matrix is a magnetic thumb target, rather than relying on 5px hit areas.
 x.addEventListener('pointerup',e=>{if(e.target.closest('button'))return;const rect=x.getBoundingClientRect();const col=Math.min(18,Math.max(0,Math.floor((e.clientX-rect.left)/(rect.width/19))));const row=Math.min(19,Math.max(0,Math.floor((e.clientY-rect.top)/(rect.height/20))));pickYearDay(Math.min(year.days,row*19+col+1))});}

  let events=data.events.filter(x=>x.date===todayISO()).sort((a,b)=>a.time.localeCompare(b.time));$('#eventNodes').innerHTML=events.slice(0,3).map((x,i)=>`<button type="button" class="time-bubble" data-event="${safe(x.id)}" aria-label="${safe(x.time)} ${safe(x.title)}"><span class="tiny-icon">${icon(i%2===0?'orbit':'clock')}</span><b>${safe(x.time)}</b><span class="text">${safe(x.title)}</span></button>`).join('');$$('[data-event]').forEach(b=>b.addEventListener('click',()=>openSheet('schedule')));

let sw=null;stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sw={x:e.clientX,y:e.clientY}}, {passive:true});stage.addEventListener('pointerup',e=>{if(!sw)return;let dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.5){let a=['eff','soul','board'];turn(a[Math.min(2,Math.max(0,a.indexOf(realm)+(dx<0?1:-1)))])}});

let ps=null;const realmPill=$('#realmPill');realmPill.addEventListener('pointerdown',e=>{const btn=e.target.closest('button[data-realm]');if(!btn)return;ps={id:e.pointerId,x:e.clientX};realmPill.setPointerCapture(e.pointerId);hoverRealm(e.clientX)});realmPill.addEventListener('pointermove',e=>{if(ps&&ps.id===e.pointerId)hoverRealm(e.clientX)});realmPill.addEventListener('pointerup',e=>{if(!ps)return;const chosen=realmAt(e.clientX);ps=null;turn(chosen);$$('.realm-pill button').forEach(b=>b.classList.toggle('chosen',b.dataset.realm===realm))});realmPill.addEventListener('pointercancel',()=>ps=null);
function realmAt(x){let r=realmPill.getBoundingClientRect();return ['eff','soul','board'][Math.max(0,Math.min(2,Math.floor((x-r.left)/(r.width/3))))]}
function hoverRealm(x){const value=realmAt(x);let idx=['eff','soul','board'].indexOf(value);$('#realmIndicator').style.transform=`translateX(${idx*100}%)`;$$('.realm-pill button').forEach(b=>b.classList.toggle('chosen',b.dataset.realm===value))}
/* Icon rail, drawer, focusing on in-place data actions. */
$$('.rail button').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.panel)));
const sheet=$('#sheet'),shade=$('#curtain'),sheetInner=$('#sheetInner'),head=$('#sheetHeading');
const kind={schedule:['clock','日程'],action:['list','行动'],mood:['face','心情'],focus:['focus','专注'],idea:['pen','灵感'],addTask:['list','行动'],addEvent:['clock','日程'],board:['board','看板']};
function openSheet(mode){closeRadial();currentPanel=mode;let entry=kind[mode]||kind.action;head.innerHTML=icon(entry[0])+`<span>${entry[1]}</span>`;$$('.rail button').forEach(b=>b.classList.toggle('active',b.dataset.panel===mode));shade.classList.add('open');sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');fillSheet(mode);vibrate(10)}
function closeSheet(){if(!currentPanel)return;currentPanel='';sheet.classList.remove('open');shade.classList.remove('open');sheet.setAttribute('aria-hidden','true');$$('.rail button').forEach(b=>b.classList.remove('active'));}
shade.addEventListener('click',closeSheet);$('#sheetClose').addEventListener('click',closeSheet);
let sy=null;$('#grab').addEventListener('pointerdown',e=>{sy=e.clientY;$('#grab').setPointerCapture(e.pointerId)});$('#grab').addEventListener('pointerup',e=>{if(sy!==null&&e.clientY-sy>65)closeSheet();sy=null});
const entryRow=(i)=>`<div class="list-row"><button type="button" class="mark ${i.done?'done':''}" data-task-id="${safe(i.id)}" aria-label="${i.done?'取消完成':'完成任务'}">${i.done?icon('check'):''}</button><div class="entry"><b class="${i.done?'done':''}">${safe(i.title)}</b><small>${i.done?'●':'◌'} · ${i.done?'✓':'→'}</small></div><span class="chev">${icon('arrow')}</span></div>`;
const block=(i)=>`<div class="list-row"><div class="mark">${icon('clock')}</div><div class="entry"><b>${safe(i.title)}</b><small>${safe(i.time)} — ${safe(i.end)}</small></div><span class="chev">${icon('arrow')}</span></div>`;
function addTaskUI(){return `<label for="task-text">✦</label><input id="task-text" maxlength="80" autocomplete="off" placeholder="留下些什么…" enterkeyhint="done"/><div class="row"><button class="primary-btn" id="do-task">${icon('check')}</button><button class="secondary-btn" id="cancel-add">${icon('close')}</button></div>`}
function addEventUI(){let t=String(new Date().getHours()).padStart(2,'0')+':00';return `<label>◷</label><input id="event-text" maxlength="80" placeholder="新时间块…"/><div class="row"><input aria-label="开始时间" type="time" id="event-time" value="${t}"/><input aria-label="结束时间" type="time" id="event-end" value="${String((new Date().getHours()+1)%24).padStart(2,'0')}:00"/></div><div class="row"><button class="primary-btn" id="do-event">${icon('check')}</button><button class="secondary-btn" id="cancel-add">${icon('close')}</button></div>`}
function fillSheet(mode){let events=data.events.filter(e=>e.date===todayISO()).sort((a,b)=>a.time.localeCompare(b.time));let inner='';if(mode==='action'){inner=`<div class="insight-tiles"><div><span class="tile-icon">${icon('list')}</span><strong>${data.tasks.filter(t=>!t.done).length}</strong><small>◌</small></div><div><span class="tile-icon">${icon('check')}</span><strong>${data.tasks.filter(t=>t.done).length}</strong><small>✓</small></div><div><span class="tile-icon">${icon('focus')}</span><strong>${data.focus.length}</strong><small>◷</small></div></div>`+data.tasks.map(entryRow).join('')+`<div class="row"><button class="primary-btn" id="addTaskInline">${icon('spark')}</button></div>`}
else if(mode==='schedule'){inner=`<div class="date-header"><b>${new Date().getDate()}</b><span>${new Intl.DateTimeFormat('zh-CN',{month:'long',weekday:'long'}).format(new Date())}</span></div>`+(events.map(block).join('')||'<div class="empty">◌</div>')+`<div class="row"><button class="primary-btn" id="addEventInline">${icon('spark')}</button></div>`}
else if(mode==='addTask'){inner=addTaskUI()}
else if(mode==='addEvent'){inner=addEventUI()}
else if(mode==='idea'){inner=`<label for="idea-text">✎</label><textarea id="idea-text" maxlength="280" placeholder="一个念头…"></textarea><div class="row"><button class="primary-btn" id="do-idea">${icon('check')}</button></div>`+data.notes.slice(0,4).map(x=>`<div class="list-row"><span class="entry"><b>${safe(x.text)}</b><small>${safe(x.when)}</small></span></div>`).join('')}
else if(mode==='mood'){inner=`<div class="mood-picker">${Array.from({length:6},(_,i)=>`<button data-mood="${i}" class="${selectedMood===i?'chosen':''}" aria-label="${['兴奋','开心','平和','发呆','疲惫','释然'][i]}">${faceSVG(i,60)}</button>`).join('')}</div><div class="row"><button class="primary-btn" id="saveMood">${icon('check')}</button></div>`}
else if(mode==='focus'){inner=`<div class="focus-disc" id="focusDisc"><strong id="focusDisplay">${formatTime(focusSeconds)}</strong></div><div class="chip-row">${[5,15,25,45].map(x=>`<button data-min="${x}" class="${Math.ceil(focusInitial/60)===x?'chosen':''}">${x}′</button>`).join('')}</div><div class="row"><button class="primary-btn" id="focusToggle">${icon(focusRunning?'pause':'play')}</button><button class="secondary-btn" id="focusReset">↺</button></div>`}
else if(mode==='board'){let done=data.tasks.filter(x=>x.done).length;inner=`<div class="insight-tiles"><div><span class="tile-icon">${icon('eff')}</span><strong>${done}</strong><small>✓</small></div><div><span class="tile-icon">${icon('focus')}</span><strong>${data.focus.reduce((a,b)=>a+b.minutes,0)}</strong><small>MIN</small></div><div><span class="tile-icon">${icon('face')}</span><strong>${Object.keys(data.moods).length}</strong><small>✿</small></div></div>`}
sheetInner.innerHTML=inner; sheetInner.scrollTop=0;bindSheet()}
function bindSheet(){sheetInner.querySelectorAll('[data-task-id]').forEach(b=>b.addEventListener('click',()=>{let x=data.tasks.find(t=>t.id===b.dataset.taskId);if(x)x.done=!x.done;store();vibrate(18);fillSheet('action')}));sheetInner.querySelector('#addTaskInline')?.addEventListener('click',()=>openSheet('addTask'));sheetInner.querySelector('#addEventInline')?.addEventListener('click',()=>openSheet('addEvent'));sheetInner.querySelector('#cancel-add')?.addEventListener('click',closeSheet);
 sheetInner.querySelector('#do-task')?.addEventListener('click',()=>{let i=$('#task-text'),t=i.value.trim();if(!t){i.focus();return}data.tasks.unshift({id:'t'+Date.now(),title:t,done:false});store();notify('✓');vibrate(18);openSheet('action')});sheetInner.querySelector('#task-text')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('#do-task').click()});
 sheetInner.querySelector('#do-event')?.addEventListener('click',()=>{let t=$('#event-text').value.trim(),s=$('#event-time').value,e=$('#event-end').value;if(!t||!s||!e){$('#event-text').focus();return}if(e<=s){notify('◷  时间');return}data.events.push({id:'e'+Date.now(),date:todayISO(),time:s,end:e,title:t,cat:'work'});store();notify('✓');openSheet('schedule')});
 sheetInner.querySelector('#do-idea')?.addEventListener('click',()=>{let t=$('#idea-text').value.trim();if(!t){$('#idea-text').focus();return}data.notes.unshift({text:t,when:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});store();vibrate(13);notify('✧');closeSheet()});
 sheetInner.querySelectorAll('[data-mood]').forEach(b=>b.addEventListener('click',()=>{selectedMood=+b.dataset.mood;chooseMood(selectedMood,false);sheetInner.querySelectorAll('[data-mood]').forEach(x=>x.classList.toggle('chosen',x===b));vibrate(9)}));sheetInner.querySelector('#saveMood')?.addEventListener('click',()=>{chooseMood(selectedMood,true);closeSheet()});
 sheetInner.querySelectorAll('[data-min]').forEach(b=>b.addEventListener('click',()=>{if(focusRunning)return;focusInitial=Number(b.dataset.min)*60;focusSeconds=focusInitial;fillSheet('focus')}));sheetInner.querySelector('#focusToggle')?.addEventListener('click',()=>{focusRunning?stopFocus():startFocus();fillSheet('focus')});sheetInner.querySelector('#focusReset')?.addEventListener('click',()=>{stopFocus();focusSeconds=focusInitial;fillSheet('focus')});updateFocusUI();}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updateFocusUI(){let d=$('#focusDisplay'),ring=$('#focusDisc');if(d)d.textContent=formatTime(focusSeconds);if(ring)ring.style.setProperty('--focus-pct',((focusInitial-focusSeconds)/focusInitial*100)+'%');}
function startFocus(){if(focusRunning)return;focusRunning=true;focusTimer=setInterval(()=>{focusSeconds=Math.max(0,focusSeconds-1);updateFocusUI();if(focusSeconds===0){stopFocus();data.focus.push({minutes:Math.max(1,Math.round(focusInitial/60)),date:todayISO()});store();vibrate(60);notify('✦  ✓');if(currentPanel==='focus')fillSheet('focus')}},1000)}
function stopFocus(){focusRunning=false;clearInterval(focusTimer);focusTimer=null}
document.addEventListener('visibilitychange',()=>{});
/* Pearl: drag freely between screen edges, clamp above navigation, tap means note */
const pearl=$('#pearl');let pearlState=null;pearl.addEventListener('pointerdown',e=>{let r=pearl.getBoundingClientRect(),f=frame.getBoundingClientRect();pearlState={pid:e.pointerId,startX:e.clientX,startY:e.clientY,relY:r.top-f.top,offX:e.clientX-r.left,offY:e.clientY-r.top,moved:false};pearl.setPointerCapture(e.pointerId);e.preventDefault()});pearl.addEventListener('pointermove',e=>{if(!pearlState||pearlState.pid!==e.pointerId)return;let dx=e.clientX-pearlState.startX,dy=e.clientY-pearlState.startY;if(Math.abs(dx)+Math.abs(dy)>9)pearlState.moved=true;if(!pearlState.moved)return;let f=frame.getBoundingClientRect(),left=Math.max(10,Math.min(f.width-56,e.clientX-f.left-pearlState.offX)),top=Math.max(128,Math.min(f.height-170,e.clientY-f.top-pearlState.offY));pearl.style.left=left+'px';pearl.style.top=top+'px';pearl.style.right='auto';pearl.classList.add('dragging');});pearl.addEventListener('pointerup',e=>{if(!pearlState)return;let moved=pearlState.moved;pearlState=null;pearl.classList.remove('dragging');if(!moved){openSheet('idea');return}let f=frame.getBoundingClientRect(),r=pearl.getBoundingClientRect(),onLeft=r.left-f.left<f.width/2;pearl.style.left=onLeft?'12px':(f.width-58)+'px';vibrate(12)});pearl.addEventListener('pointercancel',()=>{pearlState=null;pearl.classList.remove('dragging')});
/* Seed: long press -> actual magnetic hand follow -> release at chosen action. */
const seed=$('#seed'),radial=$('#radial');const petals=[{key:'addTask',symbol:'list',text:'行动'},{key:'addEvent',symbol:'clock',text:'日程'},{key:'mood',symbol:'face',text:'心情'},{key:'focus',symbol:'focus',text:'专注'},{key:'idea',symbol:'pen',text:'灵感'}];
let radialState={open:false,active:-1},press=null;const pulse=()=>vibrate(9);
function radialLayout(){const f=frame.getBoundingClientRect(),r=seed.getBoundingClientRect();let cx=r.left-f.left+r.width/2,cy=r.top-f.top+r.height/2;radialState.cx=cx;radialState.cy=cy;
 const offsets=[[-170,-70],[-100,-138],[-22,-205],[-205,-200],[-122,-275]];const layer=$('#radialItems');layer.innerHTML='';$('#rays').innerHTML='';petals.forEach((p,i)=>{let x=Math.max(42,Math.min(f.width-42,cx+offsets[i][0])),y=Math.max(135,Math.min(f.height-160,cy+offsets[i][1]));p.x=x;p.y=y;let node=document.createElement('button');node.type='button';node.className='radial-node';node.dataset.index=i;node.style.left=x+'px';node.style.top=y+'px';node.innerHTML=icon(p.symbol)+`<span class="radial-label">${p.text}</span>`;node.setAttribute('aria-label',p.text);node.addEventListener('click',e=>{e.stopPropagation();executePetal(i)});layer.append(node);
 const line=document.createElement('i');line.className='radial-line';let dx=x-cx,dy=y-cy;line.style.left=cx+'px';line.style.top=cy+'px';line.style.width=Math.hypot(dx,dy)+'px';line.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;$('#rays').append(line)});$('#radialCenter').style.left=cx+'px';$('#radialCenter').style.top=cy+'px'}
function openRadial(){if(radialState.open)return;closeSheet();radialLayout();radialState.open=true;radial.classList.add('open');radial.setAttribute('aria-hidden','false');seed.classList.add('pressing');vibrate(14)}
function closeRadial(){radialState.open=false;radialState.active=-1;radial.classList.remove('open');radial.setAttribute('aria-hidden','true');seed.classList.remove('pressing');}
function magneticPick(clientX,clientY){let f=frame.getBoundingClientRect(),x=clientX-f.left,y=clientY-f.top;let winner=-1,dist=999;petals.forEach((p,i)=>{let d=Math.hypot(x-p.x,y-p.y);if(d<dist&&d<65){dist=d;winner=i}});if(winner!==radialState.active){radialState.active=winner;pulse();$$('.radial-node').forEach((b,i)=>b.classList.toggle('selected',i===winner))}return winner}
function executePetal(i){closeRadial();let x=petals[i];if(!x)return;turn(x.key==='mood'?'soul':'eff');openSheet(x.key);vibrate(20)}
seed.addEventListener('pointerdown',e=>{e.preventDefault();let f=frame.getBoundingClientRect();press={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,opened:false};seed.setPointerCapture(e.pointerId);seed.classList.add('pressing');press.timer=setTimeout(()=>{if(press){press.opened=true;openRadial()}},220)});

seed.addEventListener('pointerup',e=>{if(!press)return;clearTimeout(press.timer);let was=press.opened;let ix=radialState.active;press=null;seed.classList.remove('pressing');if(was&&ix>=0)executePetal(ix);else if(!was||!radialState.open)openRadial();});seed.addEventListener('pointercancel',()=>{if(press)clearTimeout(press.timer);press=null;if(!radialState.open)seed.classList.remove('pressing')});
radial.addEventListener('click',e=>{if(e.target===radial||e.target.id==='rays')closeRadial()});radial.addEventListener('pointermove',e=>{if(radialState.open&&e.buttons)magneticPick(e.clientX,e.clientY)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){if(radialState.open)closeRadial();else closeSheet();}});
window.addEventListener('resize',()=>{if(radialState.open)radialLayout()});
// keep preview itself standalone, no external network and no simulated Feishu status.
drawMoods();drawStars();renderData();setInterval(renderData,30000);
