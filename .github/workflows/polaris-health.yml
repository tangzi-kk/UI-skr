name: Polaris Health Gate

on:
  pull_request:
    paths:
      - "mac-app/health*"
      - "mac-app/serve.js"
      - "mobile-app/polaris-health.js"
      - "mobile-app/mobile-app.html"
      - "mobile-app/android-project/**"
      - "docs/BAND-11-NFC-HEALTH.md"
      - ".github/workflows/polaris-health.yml"
  push:
    branches: ["feat/polaris-band11nfc-health-connect"]

permissions:
  contents: read

jobs:
  health-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate health relay and deduplication
        run: node --test mac-app/health-service.test.js
      - name: Syntax check scripts
        run: |
          node --check mac-app/health-service.js
          node --check mobile-app/polaris-health.js
          node --check mobile-app/android-project/app/src/main/assets/polaris-health.js

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Install platform SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1"
      - name: Compile Android Debug APK (not a real-device test)
        working-directory: mobile-app/android-project
        run: gradle assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
